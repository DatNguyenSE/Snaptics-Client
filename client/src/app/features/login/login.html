<div class="min-h-screen w-full flex items-center justify-center p-6 relative overflow-hidden bg-slate-50 text-slate-900 text-base selection:bg-blue-600/30">
  
  <!-- Decorative Background Elements -->
  <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-3xl animate-pulse"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s;"></div>

  <div class="relative w-full max-w-md z-10 animate-in fade-in zoom-in duration-700">
    <div class="glass-card p-8 rounded-2xl shadow-2xl border border-slate-200 flex flex-col gap-8">
      
      <!-- Header -->
      <div class="text-center space-y-2">
        <div class="w-16 h-16 mx-auto bg-gradient-to-br from-blue-800 to-purple-600 rounded-xl flex items-center justify-center mb-4 shadow-lg shadow-blue-600/20">
          <span class="material-symbols-outlined text-white text-3xl" data-icon="account_balance_wallet">account_balance_wallet</span>
        </div>
        <h1 class="text-3xl font-bold text-blue-600 tracking-tight">{{Title}}</h1>
        <p class="text-sm font-medium text-slate-500">Welcome back! Please login to your account.</p>
      </div>

      <!-- Form -->
      <form class="space-y-6" (ngSubmit)="login()" #loginForm="ngForm">
        
        <!-- Error Message -->
        @if (errorMessage) {
          <div class="bg-red-100/20 border-l-4 border-red-500 p-4 rounded-lg flex items-start gap-4 animate-in fade-in">
            <span class="material-symbols-outlined text-red-500 text-sm mt-0.5">error</span>
            <p class="text-xs font-medium text-red-500 flex-1">{{errorMessage}}</p>
          </div>
        }

        <div class="space-y-4">
          <!-- Username Input -->
          <div class="space-y-3 relative group">
            <label for="username" class="text-xs font-medium text-slate-500 px-1">Username</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors">person</span>
              <input 
                type="text" 
                id="username" 
                name="username" 
                [(ngModel)]="model.email" 
                required
                class="w-full bg-slate-100/50 border border-slate-200 text-slate-900 rounded-xl pl-12 pr-4 py-3 outline-none focus:border-blue-600 focus:bg-slate-100 transition-all text-base"
                placeholder="Enter your username"
              >
            </div>
          </div>

          <!-- Password Input -->
          <div class="space-y-3 relative group">
            <label for="password" class="text-xs font-medium text-slate-500 px-1">Password</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors">lock</span>
              <input 
                type="password" 
                id="password" 
                name="password" 
                [(ngModel)]="model.password" 
                required
                class="w-full bg-slate-100/50 border border-slate-200 text-slate-900 rounded-xl pl-12 pr-4 py-3 outline-none focus:border-blue-600 focus:bg-slate-100 transition-all text-base"
                placeholder="Enter your password"
              >
            </div>
          </div>
        </div>

        <div class="flex justify-between items-center px-1">
          <label class="flex items-center gap-2 cursor-pointer group">
            <input type="checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-600/50 focus:ring-offset-0 bg-transparent cursor-pointer">
            <span class="text-xs font-medium text-slate-500 group-hover:text-slate-900 transition-colors">Remember me</span>
          </label>
          <a href="#" class="text-xs font-medium text-blue-600 hover:text-purple-600 transition-colors">Forgot Password?</a>
        </div>

        <button 
          type="submit" 
          [disabled]="!loginForm.valid || isLoading"
          class="w-full bg-blue-600 text-white font-medium py-4 rounded-xl flex items-center justify-center gap-4 hover:bg-blue-700 transition-all active:scale-95 disabled:opacity-50 disabled:active:scale-100 disabled:cursor-not-allowed group shadow-lg shadow-blue-600/20">
          
          @if (isLoading) {
            <span class="material-symbols-outlined animate-spin text-xl">progress_activity</span>
            <span>Logging in...</span>
          } @else {
            <span>Login</span>
            <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_right_alt</span>
          }
        </button>
      </form>

      <p class="text-center text-xs font-medium text-slate-500">
        Don't have an account? <a href="#" class="text-blue-600 hover:text-purple-600 font-bold transition-colors">Sign up</a>
      </p>
    </div>
  </div>
</div>
