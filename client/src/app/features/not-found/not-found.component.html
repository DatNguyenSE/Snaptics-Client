<div class="nf-container">
  <!-- Background Glow Effects -->
  <div class="glow-bg glow-purple"></div>
  <div class="glow-bg glow-blue"></div>

  <div class="nf-card">
    <!-- Illustration / Animated Graphic -->
    <div class="nf-illustration">
      <div class="pulse-ring ring-1"></div>
      <div class="pulse-ring ring-2"></div>
      <div class="icon-wrapper">
        <span class="material-symbols-outlined nf-icon">explore_off</span>
      </div>
    </div>

    <!-- Big 404 Error Code -->
    <div class="nf-code">404</div>

    <!-- Text Content -->
    <h1 class="nf-title">Không tìm thấy trang</h1>
    <p class="nf-description">
      Trang bạn đang tìm kiếm không tồn tại, đã bị di chuyển hoặc đường dẫn không chính xác.
    </p>

    <!-- Action Buttons -->
    <div class="nf-actions">
      <button type="button" class="nf-btn nf-btn--ghost" (click)="goBack()">
        <span class="material-symbols-outlined">arrow_back</span>
        Quay lại trang trước
      </button>

      <button type="button" class="nf-btn nf-btn--primary" (click)="goHome()">
        <span class="material-symbols-outlined">home</span>
        Quay lại trang chủ
      </button>
    </div>
  </div>
</div>
