<header class="user-header">
  <div class="user-header__avatar-wrapper" (click)="onAvatarClick()" style="cursor: pointer;">
    <video 
      #avatarVideo
      src="/Roni_AI/Roni_hi_video.mp4" 
      [autoplay]="true" 
      [loop]="true" 
      [muted]="true" 
      playsinline 
      class="user-header__avatar-video-source"
    ></video>
    <canvas #avatarCanvas class="user-header__avatar-video" aria-hidden="true"></canvas>
  </div>

  <div class="user-header__text-container">
    <div class="user-header__text" [class.fade-out]="isFading" [class.user-header__text--ai]="aiResponse">
      <h3>{{ displayTitle }}</h3>
      <p class="subtitle-text" [class.subtitle-text--ai]="aiResponse" [title]="displaySubtitle">
        {{ displaySubtitle }}
        @if (isTyping) {
          <span class="typing-cursor"></span>
        }
      </p>
    </div>
  </div>

  <div class="user-header__actions">
    <div class="user-header__notification-shell" #notificationShell>
      <button
        class="user-header__notification"
        type="button"
        aria-controls="user-notification-popover"
        aria-haspopup="dialog"
        [attr.aria-expanded]="isNotificationOpen()"
        [attr.aria-label]="notificationLabel"
        (click)="toggleNotifications()"
      >
        <span class="material-symbols-outlined">notifications</span>
        @if (unreadNotificationCount() > 0) {
          <span class="user-header__notification-badge" aria-hidden="true">
            {{ unreadNotificationCount() }}
          </span>
        }
      </button>

      <app-user-notification-popover
        [isOpen]="isNotificationOpen()"
        [notifications]="notifications()"
        (notificationRead)="markNotificationAsRead($event)"
        (markAllRead)="markAllNotificationsAsRead()"
      />
    </div>
  </div>
</header>
