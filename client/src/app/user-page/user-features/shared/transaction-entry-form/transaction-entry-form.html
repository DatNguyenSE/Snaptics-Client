<form class="entry-form" [formGroup]="form" (ngSubmit)="onSave()">
  <div class="entry-form__grid">
    <label class="entry-field entry-field--full" style="display: flex; gap: 1rem; align-items: center;">
      <span class="entry-field__label" style="margin-bottom: 0;">Loại giao dịch:</span>
      <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
        <input type="radio" formControlName="isExpense" [value]="true" />
        <span>Chi tiêu</span>
      </label>
      <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
        <input type="radio" formControlName="isExpense" [value]="false" />
        <span>Thu nhập</span>
      </label>
    </label>

    <label class="entry-field">
      <span class="entry-field__label">{{ language.t('entryForm.title') }}</span>
      <input
        class="entry-field__control"
        type="text"
        formControlName="title"
        [placeholder]="language.t('entryForm.titlePlaceholder')"
      />
      @if (getErrorMessage('title'); as errorMessage) {
        <span class="entry-field__error">{{ errorMessage }}</span>
      }
    </label>

    <label class="entry-field">
      <span class="entry-field__label">{{ language.t('entryForm.amount') }}</span>
      <div class="entry-field__amount">
        <input
          class="entry-field__control"
          type="number"
          min="0"
          step="1000"
          formControlName="amount"
          [placeholder]="language.t('entryForm.amountPlaceholder')"
        />
        <span>VND</span>
      </div>
      @if (getErrorMessage('amount'); as errorMessage) {
        <span class="entry-field__error">{{ errorMessage }}</span>
      }
    </label>

    <label class="entry-field">
      <span class="entry-field__label">{{ language.t('entryForm.category') }}</span>
      <select class="entry-field__control" formControlName="category">
        <option value="">{{ language.t('entryForm.categoryPlaceholder') }}</option>
        @for (category of categories; track category.id) {
          <option [value]="category.name">{{ getCategoryLabel(category.name) }}</option>
        }
      </select>
    </label>

    <label class="entry-field">
      <span class="entry-field__label">{{ language.t('entryForm.date') }}</span>
      <input class="entry-field__control" type="date" formControlName="date" />
      @if (getErrorMessage('date'); as errorMessage) {
        <span class="entry-field__error">{{ errorMessage }}</span>
      }
    </label>

    @if (showPaymentMethod) {
      <label class="entry-field entry-field--full">
        <span class="entry-field__label">{{ language.t('entryForm.paymentMethodTitle') }}</span>
        <select class="entry-field__control" formControlName="paymentMethod">
          @for (method of paymentMethods; track method) {
            <option [value]="method">{{ getPaymentMethodLabel(method) }}</option>
          }
        </select>
      </label>
    }

    <label class="entry-field entry-field--full">
      <span class="entry-field__label">{{ language.t('entryForm.note') }}</span>
      <textarea
        class="entry-field__control entry-field__control--textarea"
        rows="4"
        formControlName="note"
        [placeholder]="language.t('entryForm.notePlaceholder')"
      ></textarea>
    </label>
  </div>

  <div class="entry-form__actions">
    <button class="entry-form__button entry-form__button--ghost" type="button" (click)="onCancel()">
      {{ cancelLabel }}
    </button>

    <button class="entry-form__button entry-form__button--primary" type="submit" [disabled]="isSaving">
      @if (isSaving) {
        {{ language.t('entryForm.saving') }}
      } @else {
        {{ saveLabel }}
      }
    </button>
  </div>
</form>
