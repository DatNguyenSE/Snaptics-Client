<div class="register-page">
  <div class="register-card">
    <div class="register-header">
      <h1>Create an Account</h1>
      <p>Create a new account to use Snaptics</p>
    </div>
    <form class="register-form" (ngSubmit)="onRegister()">
      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          name="fullName"
          [(ngModel)]="fullName"
          placeholder="Enter your full name"
        />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <svg
              *ngIf="!showPassword"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M1 12C2.73 7.61 6.99 4.5 12 4.5S21.27 7.61 23 12c-1.73 4.39-5.99 7.5-11 7.5S2.73 16.39 1 12Z"
              />
              <circle cx="12" cy="12" r="3.25" />
            </svg>
            <svg
              *ngIf="showPassword"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M3 3l18 18"
              />
              <path
                d="M10.58 10.58A2 2 0 0 0 12 14a2 2 0 0 0 1.42-.58"
              />
              <path
                d="M9.88 5.09A10.94 10.94 0 0 1 12 4.5c5.01 0 9.27 3.11 11 7.5a11.83 11.83 0 0 1-4.04 5.19"
              />
              <path
                d="M6.61 6.61A11.86 11.86 0 0 0 1 12c1.73 4.39 5.99 7.5 11 7.5 1.55 0 3.03-.3 4.39-.84"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="password-input-wrapper">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Re-enter your password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="showConfirmPassword = !showConfirmPassword"
            [attr.aria-label]="showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'"
          >
            <svg
              *ngIf="!showConfirmPassword"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M1 12C2.73 7.61 6.99 4.5 12 4.5S21.27 7.61 23 12c-1.73 4.39-5.99 7.5-11 7.5S2.73 16.39 1 12Z"
              />
              <circle cx="12" cy="12" r="3.25" />
            </svg>
            <svg
              *ngIf="showConfirmPassword"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M3 3l18 18"
              />
              <path
                d="M10.58 10.58A2 2 0 0 0 12 14a2 2 0 0 0 1.42-.58"
              />
              <path
                d="M9.88 5.09A10.94 10.94 0 0 1 12 4.5c5.01 0 9.27 3.11 11 7.5a11.83 11.83 0 0 1-4.04 5.19"
              />
              <path
                d="M6.61 6.61A11.86 11.86 0 0 0 1 12c1.73 4.39 5.99 7.5 11 7.5 1.55 0 3.03-.3 4.39-.84"
              />
            </svg>
          </button>
        </div>
      </div>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <p class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </p>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Registering...' : 'Register' }}
      </button>

      <div class="login-link">
        Already have an account?
        <a routerLink="/dang-nhap">Log In</a>
      </div>
    </form>
  </div>
</div>
