<div class="min-h-screen w-full flex items-center justify-center p-md relative overflow-hidden bg-background text-on-background font-body-md selection:bg-primary/30">
  
  <!-- Decorative Background Elements -->
  <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary/20 rounded-full blur-3xl animate-pulse"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-secondary/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s;"></div>

  <div class="relative w-full max-w-md z-10 animate-in fade-in zoom-in duration-700">
    <div class="glass-card p-xl rounded-2xl shadow-2xl border border-surface-variant/30 flex flex-col gap-lg">
      
      <!-- Header -->
      <div class="text-center space-y-xs">
        <div class="w-16 h-16 mx-auto bg-gradient-to-br from-primary-container to-secondary rounded-xl flex items-center justify-center mb-sm shadow-lg shadow-primary/20">
          <span class="material-symbols-outlined text-white text-3xl" data-icon="account_balance_wallet">account_balance_wallet</span>
        </div>
        <h1 class="text-headline-lg font-headline-lg text-primary font-bold tracking-tight">{{Title}}</h1>
        <p class="text-label-md font-label-md text-on-surface-variant">Welcome back! Please login to your account.</p>
      </div>

      <!-- Form -->
      <form class="space-y-md" (ngSubmit)="login()" #loginForm="ngForm">
        
        <!-- Error Message -->
        @if (errorMessage) {
          <div class="bg-error-container/20 border-l-4 border-error p-sm rounded-lg flex items-start gap-sm animate-in fade-in">
            <span class="material-symbols-outlined text-error text-sm mt-0.5">error</span>
            <p class="text-label-sm font-label-sm text-error flex-1">{{errorMessage}}</p>
          </div>
        }

        <div class="space-y-sm">
          <!-- Username Input -->
          <div class="space-y-base relative group">
            <label for="username" class="text-label-sm font-label-sm text-on-surface-variant px-1">Username</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
              <input 
                type="text" 
                id="username" 
                name="username" 
                [(ngModel)]="model.email" 
                required
                class="w-full bg-surface-container-high/50 border border-outline/20 text-on-surface rounded-xl pl-12 pr-sm py-3 outline-none focus:border-primary focus:bg-surface-container-high transition-all text-body-md"
                placeholder="Enter your username"
              >
            </div>
          </div>

          <!-- Password Input -->
          <div class="space-y-base relative group">
            <label for="password" class="text-label-sm font-label-sm text-on-surface-variant px-1">Password</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
              <input 
                type="password" 
                id="password" 
                name="password" 
                [(ngModel)]="model.password" 
                required
                class="w-full bg-surface-container-high/50 border border-outline/20 text-on-surface rounded-xl pl-12 pr-sm py-3 outline-none focus:border-primary focus:bg-surface-container-high transition-all text-body-md"
                placeholder="Enter your password"
              >
            </div>
          </div>
        </div>

        <div class="flex justify-between items-center px-1">
          <label class="flex items-center gap-2 cursor-pointer group">
            <input type="checkbox" class="rounded border-outline/30 bg-surface-container-highest text-primary focus:ring-primary/50 focus:ring-offset-0 bg-transparent cursor-pointer">
            <span class="text-label-sm font-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
          </label>
          <a href="#" class="text-label-sm font-label-sm text-primary hover:text-secondary transition-colors">Forgot Password?</a>
        </div>

        <button 
          type="submit" 
          [disabled]="!loginForm.valid || isLoading"
          class="w-full bg-primary-container text-on-primary-container font-label-md py-4 rounded-xl flex items-center justify-center gap-sm hover:bg-primary transition-all active:scale-95 disabled:opacity-50 disabled:active:scale-100 disabled:cursor-not-allowed group shadow-lg shadow-primary-container/20">
          
          @if (isLoading) {
            <span class="material-symbols-outlined animate-spin text-xl">progress_activity</span>
            <span>Logging in...</span>
          } @else {
            <span>Login</span>
            <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_right_alt</span>
          }
        </button>
      </form>

      <p class="text-center text-label-sm font-label-sm text-on-surface-variant">
        Don't have an account? <a href="#" class="text-primary hover:text-secondary font-bold transition-colors">Sign up</a>
      </p>
    </div>
  </div>
</div>
